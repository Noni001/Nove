<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login — NovaVest</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#07111f;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
}

.logo{
    text-align:center;
    margin-bottom:30px;
    font-size:25px;
    font-weight:800;
}

.logo span{
    display:inline-flex;
    width:42px;
    height:42px;
    align-items:center;
    justify-content:center;
    background:#10b981;
    color:#03110c;
    border-radius:13px;
    margin-right:8px;
}

.card{
    background:#0d1b2a;
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    padding:28px 22px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
}

h1{
    font-size:28px;
    margin-bottom:8px;
}

.subtitle{
    color:#8e9caf;
    font-size:14px;
    line-height:1.5;
    margin-bottom:28px;
}

label{
    display:block;
    color:#cbd5e1;
    font-size:13px;
    font-weight:600;
    margin-bottom:8px;
}

.input-group{
    margin-bottom:18px;
}

input{
    width:100%;
    padding:14px;
    border-radius:11px;
    border:1px solid #243449;
    background:#081523;
    color:white;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#10b981;
}

.password-row{
    position:relative;
}

.password-row input{
    padding-right:65px;
}

.show-password{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:#10b981;
    cursor:pointer;
    font-size:12px;
}

.login-button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:11px;
    background:#10b981;
    color:#03110c;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    margin-top:5px;
}

.login-button:active{
    transform:scale(.98);
}

.message{
    display:none;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
    font-size:13px;
}

.error{
    background:rgba(239,68,68,.12);
    color:#f87171;
}

.success{
    background:rgba(16,185,129,.12);
    color:#34d399;
}

.links{
    text-align:center;
    margin-top:22px;
}

.links p{
    color:#7f8da0;
    font-size:14px;
}

.links a{
    color:#34d399;
    text-decoration:none;
    font-weight:700;
}

.back{
    display:block;
    text-align:center;
    margin-top:22px;
    color:#8e9caf;
    text-decoration:none;
    font-size:14px;
}

@media(max-width:400px){

    .card{
        padding:24px 18px;
    }

    h1{
        font-size:25px;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <span>N</span>
        NovaVest
    </div>

    <div class="card">

        <h1>Welcome back</h1>

        <p class="subtitle">
            Sign in to access your NovaVest dashboard.
        </p>

        <div id="message" class="message"></div>

        <form id="loginForm">

            <div class="input-group">

                <label for="email">
                    Email address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <div class="password-row">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()"
                    >
                        Show
                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Sign In
            </button>

        </form>


        <div class="links">

            <p>
                Don't have an account?
                <a href="register.html">
                    Create one
                </a>
            </p>

        </div>

    </div>


    <a href="index.html" class="back">
        ← Back to homepage
    </a>

</div>


<script>

function togglePassword(){

    const password =
        document.getElementById("password");

    const button =
        document.querySelector(".show-password");

    if(password.type === "password"){

        password.type = "text";
        button.textContent = "Hide";

    }else{

        password.type = "password";
        button.textContent = "Show";

    }

}


document
.getElementById("loginForm")
.addEventListener("submit", function(event){

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");


    if(!email || !password){

        message.textContent =
            "Please enter your email and password.";

        message.className =
            "message error";

        message.style.display =
            "block";

        return;

    }


    message.textContent =
        "Login form ready. Connect this form to the backend authentication system.";

    message.className =
        "message success";

    message.style.display =
        "block";

});

</script>

</body>
</html>
