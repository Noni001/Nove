<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - NovaVest</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  background:#070d18;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:430px;
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:800;
  margin-bottom:8px;
}

.logo span{
  color:#10b981;
}

.admin-label{
  text-align:center;
  color:#94a3b8;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1.5px;
  margin-bottom:25px;
}

.card{
  background:#0d1726;
  border:1px solid #1e2b3d;
  border-radius:20px;
  padding:25px 20px;
  box-shadow:0 15px 50px rgba(0,0,0,.35);
}

.security{
  background:#101f2d;
  border:1px solid #244153;
  border-radius:12px;
  padding:13px;
  margin-bottom:20px;
  display:flex;
  gap:10px;
  font-size:12px;
  line-height:1.5;
  color:#b8c4d1;
}

.security-icon{
  font-size:19px;
}

h1{
  font-size:23px;
  margin-bottom:7px;
}

.subtitle{
  color:#8996a6;
  font-size:13px;
  margin-bottom:23px;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

.input-group{
  margin-bottom:17px;
}

input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #29384a;
  background:#09121f;
  color:white;
  outline:none;
  font-size:14px;
}

input:focus{
  border-color:#10b981;
}

.password-wrap{
  position:relative;
}

.password-wrap input{
  padding-right:50px;
}

.show-password{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  background:none;
  border:0;
  color:#94a3b8;
  cursor:pointer;
  font-size:18px;
}

.login-button{
  width:100%;
  border:0;
  border-radius:11px;
  padding:14px;
  background:#10b981;
  color:white;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  margin-top:5px;
}

.login-button:active{
  transform:scale(.99);
}

.message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  font-size:12px;
  line-height:1.5;
}

.message.error{
  display:block;
  background:#3b1518;
  color:#fecaca;
  border:1px solid #7f1d1d;
}

.message.success{
  display:block;
  background:#08251b;
  color:#a7f3d0;
  border:1px solid #065f46;
}

.back{
  display:block;
  text-align:center;
  color:#94a3b8;
  text-decoration:none;
  font-size:13px;
  margin-top:20px;
}

.back:hover{
  color:white;
}

.footer{
  text-align:center;
  color:#64748b;
  font-size:11px;
  margin-top:25px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    Nova<span>Vest</span>
  </div>

  <div class="admin-label">
    Secure Administration Portal
  </div>


  <div class="card">

    <div class="security">
      <div class="security-icon">🔐</div>

      <div>
        <strong>Administrator Access</strong><br>
        This area is restricted to authorized NovaVest administrators.
      </div>
    </div>


    <h1>Admin Login</h1>

    <p class="subtitle">
      Sign in to manage the NovaVest platform.
    </p>


    <form id="adminLoginForm">

      <div class="input-group">

        <label for="email">
          Admin Email
        </label>

        <input
          type="email"
          id="email"
          placeholder="admin@example.com"
          autocomplete="username"
          required
        >

      </div>


      <div class="input-group">

        <label for="password">
          Password
        </label>

        <div class="password-wrap">

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="show-password"
            onclick="togglePassword()"
            id="toggleButton"
          >
            👁
          </button>

        </div>

      </div>


      <button
        type="submit"
        class="login-button"
      >
        Sign In
      </button>

    </form>


    <div id="message" class="message"></div>

  </div>


  <a href="index.html" class="back">
    ← Back to NovaVest
  </a>


  <div class="footer">
    NovaVest Administration Portal<br>
    Authorized access only
  </div>

</div>


<script>

function togglePassword(){

  const password =
    document.getElementById("password");

  const button =
    document.getElementById("toggleButton");

  if(password.type === "password"){

    password.type = "text";
    button.textContent = "🙈";

  }else{

    password.type = "password";
    button.textContent = "👁";

  }

}


document
.getElementById("adminLoginForm")
.addEventListener("submit", function(event){

  event.preventDefault();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("message");


  if(!email || !password){

    message.className = "message error";

    message.textContent =
      "Please enter your administrator email and password.";

    return;

  }


  /*
    FRONTEND DEMO ONLY

    No real administrator credentials are stored
    in this HTML file.

    The production version will send these credentials
    to the secure backend authentication API.
  */

  message.className = "message success";

  message.textContent =
    "Admin login form is ready. Secure backend authentication will be connected next.";

});


</script>

</body>
</html>
