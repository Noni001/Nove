<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account — NovaVest</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#07111f;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:440px;
}

.logo{
    text-align:center;
    margin-bottom:28px;
    font-size:25px;
    font-weight:800;
}

.logo span{
    display:inline-flex;
    width:42px;
    height:42px;
    align-items:center;
    justify-content:center;
    background:#10b981;
    color:#03110c;
    border-radius:13px;
    margin-right:8px;
}

.card{
    background:#0d1b2a;
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    padding:28px 22px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
}

h1{
    font-size:28px;
    margin-bottom:8px;
}

.subtitle{
    color:#8e9caf;
    font-size:14px;
    line-height:1.5;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:16px;
}

label{
    display:block;
    color:#cbd5e1;
    font-size:13px;
    font-weight:600;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:14px;
    border-radius:11px;
    border:1px solid #243449;
    background:#081523;
    color:white;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#10b981;
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:65px;
}

.show-password{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:none;
    color:#10b981;
    cursor:pointer;
    font-size:12px;
}

.terms{
    display:flex;
    gap:9px;
    align-items:flex-start;
    margin:17px 0;
}

.terms input{
    width:16px;
    height:16px;
    margin-top:2px;
}

.terms label{
    font-size:12px;
    color:#8997aa;
    line-height:1.5;
    font-weight:400;
}

.terms a{
    color:#34d399;
    text-decoration:none;
}

.register-button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:11px;
    background:#10b981;
    color:#03110c;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}

.message{
    display:none;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
    font-size:13px;
    line-height:1.5;
}

.error{
    background:rgba(239,68,68,.12);
    color:#f87171;
}

.success{
    background:rgba(16,185,129,.12);
    color:#34d399;
}

.login-link{
    text-align:center;
    margin-top:20px;
    color:#7f8da0;
    font-size:14px;
}

.login-link a{
    color:#34d399;
    text-decoration:none;
    font-weight:700;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#8e9caf;
    text-decoration:none;
    font-size:14px;
}

@media(max-width:400px){

    .card{
        padding:24px 18px;
    }

    h1{
        font-size:25px;
    }

}

</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
</head>

<body>

<div class="container">

    <div class="logo">
        <span>N</span>
        NovaVest
    </div>


    <div class="card">

        <h1>Create your account</h1>

        <p class="subtitle">
            Join NovaVest and access your personalized
            investment dashboard.
        </p>


        <div id="message" class="message"></div>


        <form id="registerForm">


            <div class="input-group">

                <label for="fullName">
                    Full name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Your full name"
                    required
                >

            </div>


            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Choose a username"
                    minlength="3"
                    required
                >

            </div>


            <div class="input-group">

                <label for="email">
                    Email address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('password', this)"
                    >
                        Show
                    </button>

                </div>

            </div>


            <div class="input-group">

                <label for="confirmPassword">
                    Confirm password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Repeat your password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('confirmPassword', this)"
                    >
                        Show
                    </button>

                </div>

            </div>


            <div class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                <label for="terms">

                    I agree to the
                    <a href="#">
                        Terms of Service
                    </a>
                    and
                    <a href="#">
                        Privacy Policy
                    </a>.

                </label>

            </div>


            <button
                type="submit"
                class="register-button"
            >
                Create Account
            </button>

        </form>


        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Sign in
            </a>

        </div>

    </div>


    <a href="index.html" class="back">
        ← Back to homepage
    </a>

</div>


<script>
function togglePassword(id,button){
 const input=document.getElementById(id); input.type=input.type==="password"?"text":"password"; button.textContent=input.type==="password"?"Show":"Hide";
}
window.supabaseClient=window.supabase.createClient(window.NOVAVEST_SUPABASE_URL,window.NOVAVEST_SUPABASE_KEY);
document.getElementById("registerForm").addEventListener("submit",async function(e){
 e.preventDefault();
 const message=document.getElementById("message");
 const fullName=document.getElementById("fullName").value.trim(),username=document.getElementById("username").value.trim(),email=document.getElementById("email").value.trim(),password=document.getElementById("password").value,confirmPassword=document.getElementById("confirmPassword").value;\n const referralId=new URLSearchParams(window.location.search).get("ref");\n const referralUuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(referralId||"")?referralId:null;
 if(password!==confirmPassword){message.textContent="The passwords do not match.";message.className="message error";message.style.display="block";return;}
 if(password.length<8){message.textContent="Password must contain at least 8 characters.";message.className="message error";message.style.display="block";return;}
 message.textContent="Creating your account...";message.className="message success";message.style.display="block";
 const {data,error}=await window.supabaseClient.auth.signUp({email,password,options:{data:{full_name:fullName,username,referrer_id:referralUuid}}});
 if(error){message.textContent=error.message;message.className="message error";return;}
 if(data.session){window.location.href="dashboard.html";return;}
 message.textContent="Account created. Check your email to confirm your account, then sign in.";
});
</script>

</body>
</html>
